<!DOCTYPE html>

<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://unpkg.com https://www.googletagmanager.com https://plausible.io; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; media-src 'self' blob:; connect-src 'self' https://www.google-analytics.com https://region1.google-analytics.com https://plausible.io https://formspree.io https://api.hsforms.com https://hooks.zapier.com; object-src 'none'; base-uri 'self'; form-action 'self' https://formspree.io mailto:;">

<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=Manrope:wght@400;500;600&amp;family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&amp;display=swap" rel="stylesheet">
<style>
@keyframes header-compact { to { height: 62px; background: rgba(252,251,248,.98); box-shadow: 0 10px 30px rgba(16,24,40,.08); } }
@keyframes menu-in { from { opacity: 0; transform: translateX(-50%) translateY(-8px) scale(.98); } to { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); } }
@keyframes item-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
nav[aria-label="Primary navigation"] a[aria-expanded] { transition: background .25s cubic-bezier(.4,0,.2,1), color .25s cubic-bezier(.4,0,.2,1); }
nav[aria-label="Primary navigation"] a[aria-expanded]:hover { background: rgba(16,24,40,.05); }
[data-menu] a[href] { transition: background .2s cubic-bezier(.4,0,.2,1), transform .3s cubic-bezier(.16,1,.3,1); animation: item-in .35s cubic-bezier(.16,1,.3,1) both; }
[data-menu] a[href]:hover { transform: translateX(2px); }
[data-menu] a[href]:hover > span[aria-hidden] { transform: translateX(3px); }
[data-menu] a[href] > span[aria-hidden] { transition: transform .3s cubic-bezier(.16,1,.3,1); }
[data-menu] a[href]:nth-child(1) { animation-delay: .03s; } [data-menu] a[href]:nth-child(2) { animation-delay: .07s; } [data-menu] a[href]:nth-child(3) { animation-delay: .11s; } [data-menu] a[href]:nth-child(4) { animation-delay: .15s; } [data-menu] a[href]:nth-child(5) { animation-delay: .19s; }
:focus-visible { outline: 2px solid #3f7afe; outline-offset: 3px; border-radius: 6px; }

/* ---- interaction polish ---- */
:root { --ease-out: cubic-bezier(.16,1,.3,1); --ease-soft: cubic-bezier(.4,0,.2,1); }
html { scroll-behavior: smooth; }
::selection { background: rgba(63,122,254,.18); color: #101828; }
:focus { outline: none; }
:focus-visible { outline: 2px solid #3f7afe; outline-offset: 3px; border-radius: 6px; }
[data-btn]:focus-visible { outline-offset: 2px; }
/* buttons: press ripple */
[data-btn] { position: relative; overflow: hidden; isolation: isolate; -webkit-tap-highlight-color: transparent; }
[data-btn]::before { content: ''; position: absolute; inset: 0; background: radial-gradient(120px circle at var(--px, 50%) var(--py, 50%), rgba(255,255,255,.35), transparent 60%); opacity: 0; transition: opacity .5s var(--ease-soft); pointer-events: none; }
[data-btn]:active::before { opacity: 1; transition-duration: 0s; }
[data-btn="ghost"]::before, [data-btn="ghost-dark"]::before { background: radial-gradient(120px circle at var(--px, 50%) var(--py, 50%), rgba(63,122,254,.16), transparent 60%); }
/* cards & links: uniform hover motion */
a[href], button { -webkit-tap-highlight-color: transparent; }
a[href][style*="border-radius: 2"], a[href][style*="border-radius: 1"] { transition: transform .45s var(--ease-out), box-shadow .45s var(--ease-soft), border-color .25s var(--ease-soft), background .25s var(--ease-soft); }
a[href][style*="border-radius: 2"]:active, a[href][style*="border-radius: 1"]:active { transform: translateY(0) scale(.992) !important; transition-duration: .12s; }
a[href] img[style*="object-fit: cover"] { transition: transform .9s var(--ease-out), opacity .4s var(--ease-soft); }
a[href]:hover img[style*="object-fit: cover"] { transform: scale(1.04); }
/* tabs / rows */
button[role="tab"], [role="radiogroup"] > button, [role="radio"] { transition: background .3s var(--ease-soft), color .3s var(--ease-soft), border-color .3s var(--ease-soft), box-shadow .3s var(--ease-soft), transform .3s var(--ease-out); }
button[role="tab"]:hover, [role="radio"]:hover { background: rgba(16,24,40,.035); }
button[role="tab"]:active, [role="radio"]:active { transform: scale(.995); }
button[role="tab"] > span:first-child { transition: color .3s var(--ease-soft), transform .3s var(--ease-out); }
/* footer & text links */
footer a[href] { position: relative; transition: color .25s var(--ease-soft); }
footer nav a[href]::after { content: ''; position: absolute; left: 0; bottom: 2px; width: 100%; height: 1px; background: currentColor; transform: scaleX(0); transform-origin: right; transition: transform .35s var(--ease-out); }
footer nav a[href]:hover::after { transform: scaleX(1); transform-origin: left; }
/* nav links (dc-import AllusNav) */
nav[aria-label="Primary navigation"] a[href] { transition: background .25s var(--ease-soft), color .25s var(--ease-soft); }
/* pill switchers */
nav[aria-label] a[href][style*="border-radius: 999px"], nav[aria-label] button[style*="border-radius: 999px"] { transition: background .3s var(--ease-soft), color .3s var(--ease-soft), box-shadow .3s var(--ease-soft); }
/* inputs */
input, textarea, select { transition: border-color .25s var(--ease-soft), box-shadow .25s var(--ease-soft), background .25s var(--ease-soft); }
input:hover, textarea:hover, select:hover { border-color: rgba(17,19,24,.32) !important; }
/* accordion + icons */
button[aria-expanded] { transition: color .25s var(--ease-soft); }
button[aria-expanded]:hover { color: #2459d3; }
button[aria-expanded]:hover > span[aria-hidden] { border-color: #2459d3 !important; background: #eef3ff; }
/* stat numbers */
strong[style*="font-size: 56px"], strong[style*="font-size: 52px"], strong[style*="font-size: 44px"] { font-variant-numeric: tabular-nums; }
/* chips */
li[style*="border-radius: 999px"], span[style*="border-radius: 999px"][style*="border: 1px solid"] { transition: border-color .25s var(--ease-soft), background .25s var(--ease-soft), transform .3s var(--ease-out); }
li[style*="border-radius: 999px"]:hover { border-color: rgba(16,24,40,.32) !important; transform: translateY(-1px); }
/* images fade in */
img[loading="lazy"] { animation: fade-up .6s var(--ease-out) both; }
</style>
<script>document.addEventListener('pointerdown', e => { const b = e.target.closest && e.target.closest('[data-btn]'); if (!b) return; const r = b.getBoundingClientRect(); b.style.setProperty('--px', ((e.clientX - r.left) / r.width * 100) + '%'); b.style.setProperty('--py', ((e.clientY - r.top) / r.height * 100) + '%'); }, { passive: true });</script>
</helmet>
<header onMouseLeave="{{ scheduleClose }}" onKeyDown="{{ onKey }}" onFocusCapture="{{ cancelClose }}" onBlurCapture="{{ scheduleClose }}" style="position: relative; z-index: 25; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; height: 72px; animation: header-compact linear both; animation-timeline: scroll(root); animation-range: 0px 160px; padding-inline: max(24px, calc((100% - 1180px) / 2)); border-bottom: 1px solid rgba(17,19,24,.09); background: rgba(252,251,248,.92); backdrop-filter: blur(10px);">
  <a href="index.html" aria-label="Allus AI home" style="display: inline-flex; align-items: center; min-height: 44px; width: max-content;"><img src="assets/allus-logo-navy.svg" alt="Allus AI" style="display: block; width: 136px; height: auto;"></a>
  <nav aria-label="Primary navigation" style="display: flex; align-items: center; gap: 2px; height: 100%;">
    <sc-for list="{{ items }}" as="n" hint-placeholder-count="5">
      <div onMouseEnter="{{ n.open }}" onFocus="{{ n.open }}" style="position: relative; display: flex; align-items: center; height: 100%;">
        <a href="{{ n.href }}" aria-expanded="{{ n.isOpen }}" aria-haspopup="true" onKeyDown="{{ n.keys }}" style="{{ n.style }}">{{ n.label }}</a>
        <span aria-hidden="true" style="{{ n.underline }}"></span>
        <sc-if value="{{ n.isOpen }}" hint-placeholder-val="{{ false }}">
          <div data-menu onMouseEnter="{{ cancelClose }}" style="position: absolute; top: calc(100% - 6px); left: 50%; z-index: 30; min-width: 280px; transform: translateX(-50%); padding: 8px; border: 1px solid rgba(17,19,24,.1); border-radius: 18px; background: rgba(252,251,248,.98); backdrop-filter: blur(14px); box-shadow: 0 24px 60px rgba(16,24,40,.16); animation: menu-in .32s cubic-bezier(.16,1,.3,1) both; transform-origin: top center;">
            <sc-for list="{{ n.children }}" as="c" hint-placeholder-count="3">
              <a href="{{ c.href }}" style="display: grid; grid-template-columns: minmax(0, 1fr) 14px; gap: 12px; align-items: center; padding: 11px 14px; border-radius: 12px; transition: background .18s ease;" style-hover="background: #eef3ff;">
                <span style="display: grid; gap: 2px;"><strong style="font-size: 15px; font-weight: 600; letter-spacing: -.015em; line-height: 1.3;">{{ c.title }}</strong><span style="color: #5f687a; font-size: 13px; line-height: 1.4;">{{ c.note }}</span></span>
                <span aria-hidden="true" style="color: #2459d3; font-size: 14px;">→</span>
              </a>
            </sc-for>
            <sc-if value="{{ n.hasOverview }}" hint-placeholder-val="{{ true }}">
              <a href="{{ n.href }}" style="display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 6px; padding: 10px 14px; border-top: 1px solid rgba(16,24,40,.1); color: #5f687a; font-size: 13px; font-weight: 600;" style-hover="color: #101828;">{{ n.overview }} <span aria-hidden="true">→</span></a>
            </sc-if>
          </div>
        </sc-if>
      </div>
    </sc-for>
  </nav>
  <button type="button" data-nav-toggle aria-label="Open menu" aria-expanded="{{ drawerOpen }}" aria-controls="allus-drawer" onClick="{{ toggleDrawer }}" style="display: none; position: relative; justify-self: end; place-items: center; width: 44px; height: 44px; border: 1px solid rgba(17,19,24,.14); border-radius: 12px; background: #fff; color: #101828; cursor: pointer;"><span aria-hidden="true" style="{{ bar1 }}"></span><span aria-hidden="true" style="{{ bar2 }}"></span><span aria-hidden="true" style="{{ bar3 }}"></span></button>
  <sc-if value="{{ drawerOpen }}" hint-placeholder-val="{{ false }}">
    <div id="allus-drawer" data-drawer role="dialog" aria-label="Site menu" style="position: fixed; top: 62px; right: 0; bottom: 0; left: 0; z-index: 60; overflow-y: auto; padding: 8px 20px 40px; background: #fcfbf8; animation: item-in .25s cubic-bezier(.16,1,.3,1) both;">
      <sc-for list="{{ items }}" as="g" hint-placeholder-count="5">
        <div style="padding: 14px 0 6px; border-bottom: 1px solid rgba(16,24,40,.1);">
          <a href="{{ g.href }}" onClick="{{ closeDrawer }}" style="display: flex; justify-content: space-between; align-items: center; min-height: 44px; font-size: 17px; font-weight: 600; letter-spacing: -.02em;">{{ g.label }} <span aria-hidden="true" style="color: #2459d3;">→</span></a>
          <div style="display: grid; padding: 2px 0 8px;"><sc-for list="{{ g.children }}" as="c" hint-placeholder-count="3"><a href="{{ c.href }}" onClick="{{ closeDrawer }}" style="display: flex; align-items: center; min-height: 44px; padding-left: 12px; color: #3a4356; font-size: 15px;">{{ c.title }}</a></sc-for></div>
        </div>
      </sc-for>
      <a href="connect.html?intent=demo" onClick="{{ closeDrawer }}" style="display: flex; align-items: center; justify-content: center; gap: 10px; height: 48px; margin-top: 20px; border-radius: 12px; background: #2459d3; color: #fff; font-size: 15px; font-weight: 600;">Request a demo <span aria-hidden="true">→</span></a>
    </div>
  </sc-if>
  <a href="connect.html?intent=demo" data-nav-cta style="justify-self: end; display: inline-flex; align-items: center; gap: 10px; height: 38px; padding: 0 16px; color: #fcfbf8; border-radius: 10px; background: #111318; font-size: 14px; font-weight: 600; letter-spacing: -.01em; transition: background .25s cubic-bezier(.4,0,.2,1), transform .3s cubic-bezier(.16,1,.3,1), box-shadow .3s ease;" style-hover="background: #2459d3; transform: translateY(-1px); box-shadow: 0 10px 24px rgba(36,89,211,.24);" style-active="transform: translateY(0) scale(.985);">Request a demo <span aria-hidden="true" style="display: inline-block; font-size: 15px; transition: transform .3s cubic-bezier(.16,1,.3,1);">→</span></a>
</header>
<div data-mobile-cta aria-hidden="{{ ctaHidden }}" style="{{ mobileCtaStyle }}"><a href="connect.html?intent=demo" data-btn="primary" style="position: relative; display: flex; align-items: center; justify-content: center; gap: 12px; height: 50px; color: #fcfbf8; border-radius: 14px; background: #2459d3; font-size: 15px; font-weight: 600; letter-spacing: -.01em; box-shadow: 0 10px 26px rgba(36,89,211,.26);">Request a demo <span aria-hidden="true" style="position: absolute; right: 10px; display: grid; place-items: center; width: 28px; height: 28px; border-radius: 8px; background: rgba(255,255,255,.16); color: #fff; font-size: 14px; line-height: 1;">→</span></a></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:420},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;model&quot;,&quot;options&quot;:[&quot;&quot;,&quot;model&quot;,&quot;solutions&quot;,&quot;industries&quot;,&quot;stories&quot;,&quot;company&quot;],&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { open: null, drawer: false, cta: false };
  componentDidMount() {
    this._onScroll = () => { const y = window.scrollY, rest = document.documentElement.scrollHeight - y - window.innerHeight; const show = y > 560 && rest > 720 && !this.state.drawer; if (show !== this.state.cta) this.setState({ cta: show }); };
    window.addEventListener('scroll', this._onScroll, { passive: true }); this._onScroll();
  }
  componentWillUnmount() { clearTimeout(this._t); document.body.style.overflow = ''; window.removeEventListener('scroll', this._onScroll); }
  setDrawer(v) { this.setState({ drawer: v }); document.body.style.overflow = v ? 'hidden' : ''; }
  renderVals() {
    const active = this.props.active || '';
    const cta = this.state.cta && !this.state.drawer;
    const open = this.state.open;
    const menus = [
      ['model', 'Model', 'model.html', 'Model overview', [['AllusONE', 'Core model — sees and reasons', 'model-detail.html?model=allusone'], ['AllusFlow', 'Video → steps, timing, evidence', 'model-detail.html?model=allusflow'], ['AllusEdge', 'Runs on your hardware', 'model-detail.html?model=allusedge']]],
      ['solutions', 'Solutions', 'solutions.html', 'All solutions', [['Knowledge & Guidance', 'Expert know-how at the station', 'solution.html?solution=operational-knowledge-guidance'], ['Process Intelligence', 'Every cycle on a timeline', 'solution.html?solution=production-process-intelligence'], ['Asset Intelligence', 'Condition tied to the record', 'solution.html?solution=equipment-asset-intelligence'], ['Site Intelligence', 'Governed, human-reviewed events', 'solution.html?solution=industrial-safety-site-intelligence']]],
      ['industries', 'Industries', 'industry.html?industry=electronics-assembly', '', [['Electronics Assembly', '', 'industry.html?industry=electronics-assembly'], ['Automotive', '', 'industry.html?industry=automotive'], ['FMCG', '', 'industry.html?industry=fmcg'], ['Food & Beverage', '', 'industry.html?industry=food-beverage'], ['Advanced Materials', '', 'industry.html?industry=advanced-materials']]],
      ['stories', 'Customer Stories', 'story.html?story=advanced-materials', '', [['Advanced Materials', 'Specialist knowledge, preserved', 'story.html?story=advanced-materials'], ['Electronics Assembly', 'Variant context at the station', 'story.html?story=electronics-assembly'], ['Biscuit Production', 'Changeover steps, one context', 'story.html?story=biscuit-production']]],
      ['company', 'Company', 'company.html', '', [['About Us', '', 'company.html'], ['Privacy', '', 'privacy.html'], ['Terms', '', 'terms.html'], ['Connect', '', 'connect.html?intent=demo']]]
    ];
    const openMenu = key => { clearTimeout(this._t); if (this.state.open !== key) this.setState({ open: key }); };
    return {
      items: menus.map(([key, label, href, overview, children]) => { const isOpen = open === key, isActive = active === key; return { label, href, isOpen, overview, hasOverview: !!overview, open: () => openMenu(key),
        keys: e => { if (e.key === 'ArrowDown' || e.key === ' ') { e.preventDefault(); openMenu(key); setTimeout(() => { const first = e.target.parentElement.querySelector('[data-menu] a[href]'); if (first) first.focus(); }, 60); } },
        children: children.map(([title, note, h]) => ({ title, note, href: h })),
        style: { display: 'inline-flex', alignItems: 'center', height: 44, padding: '0 14px', fontSize: 15, fontWeight: 500, color: isOpen || isActive ? '#101828' : '#3a4356', transition: 'color .2s ease' },
        underline: { position: 'absolute', left: 14, right: 14, bottom: 14, height: 2, borderRadius: 2, background: '#2459d3', transformOrigin: 'left', transform: isOpen || isActive ? 'scaleX(1)' : 'scaleX(0)', transition: 'transform .3s cubic-bezier(.16,1,.3,1)' } }; }),
      drawerOpen: this.state.drawer,
      toggleDrawer: () => this.setDrawer(!this.state.drawer),
      closeDrawer: () => this.setDrawer(false),
      bar1: { position: 'absolute', width: 18, height: 2, borderRadius: 1, background: 'currentColor', transition: 'transform .3s cubic-bezier(.16,1,.3,1), opacity .2s', transform: this.state.drawer ? 'rotate(45deg)' : 'translateY(-6px)' },
      bar2: { position: 'absolute', width: 18, height: 2, borderRadius: 1, background: 'currentColor', transition: 'opacity .2s', opacity: this.state.drawer ? 0 : 1 },
      bar3: { position: 'absolute', width: 18, height: 2, borderRadius: 1, background: 'currentColor', transition: 'transform .3s cubic-bezier(.16,1,.3,1)', transform: this.state.drawer ? 'rotate(-45deg)' : 'translateY(6px)' },
      scheduleClose: () => { clearTimeout(this._t); this._t = setTimeout(() => this.setState({ open: null }), 140); },
      cancelClose: () => clearTimeout(this._t),
      ctaHidden: !cta,
      mobileCtaStyle: { display: 'none', position: 'fixed', left: 0, right: 0, bottom: 0, zIndex: 50, padding: '10px 16px calc(10px + env(safe-area-inset-bottom))', background: 'rgba(252,251,248,.94)', backdropFilter: 'blur(12px)', borderTop: '1px solid rgba(16,24,40,.1)', transform: cta ? 'translateY(0)' : 'translateY(110%)', transition: 'transform .45s cubic-bezier(.16,1,.3,1)', pointerEvents: cta ? 'auto' : 'none' },
      onKey: e => {
        if (e.key === 'Escape') { if (this.state.drawer) { this.setDrawer(false); const b = e.currentTarget.querySelector('[data-nav-toggle]'); if (b) b.focus(); return; } const t = e.currentTarget.querySelector('a[aria-expanded="true"]'); this.setState({ open: null }); if (t) t.focus(); return; }
        const menu = e.target.closest && e.target.closest('[data-menu]'); if (!menu) return;
        const links = Array.from(menu.querySelectorAll('a[href]')); const i = links.indexOf(document.activeElement);
        if (e.key === 'ArrowDown') { e.preventDefault(); (links[i + 1] || links[0]).focus(); }
        if (e.key === 'ArrowUp') { e.preventDefault(); (links[i - 1] || links[links.length - 1]).focus(); }
      }
    };
  }
}
</script>
